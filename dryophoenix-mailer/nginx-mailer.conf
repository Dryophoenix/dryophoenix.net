# ── Nginx config for dryophoenix mailing list ────────────────────────────────
# Place this file at: /etc/nginx/sites-available/mailer
# Then: sudo ln -s /etc/nginx/sites-available/mailer /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name dryophoenix.net;          # or a subdomain like mail.dryophoenix.net

    # ── Let's Encrypt (certbot will fill this in automatically) ──
    # If you haven't run certbot yet:
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d dryophoenix.net
    # Certbot will add the SSL block below automatically.

    # ── Proxy all /mailer/* traffic to Flask ──────────────────────
    location /mailer/ {
        proxy_pass         http://127.0.0.1:5000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── Webhook endpoint (Power Automate hits this) ───────────────
    # Power Automate URL: https://dryophoenix.net/webhook
    location /webhook {
        proxy_pass         http://127.0.0.1:5000/webhook;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── Your existing site content lives here ────────────────────
    location / {
        root   /var/www/html;    # adjust to wherever your site files live
        index  index.html;
        try_files $uri $uri/ =404;
    }
}

# NOTE: If certbot has already generated an SSL config for this domain,
# edit that file instead of creating a new one — just add the location
# blocks above into the existing server {} block.
