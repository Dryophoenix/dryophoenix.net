<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · dryophoenix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #181818; --border: #2a2a2a;
      --text: #e8e8e8; --muted: #666; --accent: #7fff6e; --danger: #ff5f5f;
      --mono: 'IBM Plex Mono', monospace;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--mono); font-size: 14px;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 40px 36px; width: 320px;
    }
    .wordmark { color: var(--accent); font-size: 12px; letter-spacing: 0.08em; margin-bottom: 28px; }
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 6px; }
    input[type=password] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text); font-family: var(--mono);
      font-size: 13px; padding: 8px 10px; outline: none; margin-bottom: 14px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; background: transparent; border: 1px solid var(--accent);
      border-radius: 3px; color: var(--accent); font-family: var(--mono);
      font-size: 12px; padding: 8px; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    button:hover { background: var(--accent); color: #000; }
    .error { color: var(--danger); font-size: 11px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="wordmark">// dryophoenix · mailing list</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="password">password</label>
      <input type="password" id="password" name="password" autofocus />
      <button type="submit">enter</button>
    </form>
  </div>
</body>
</html>
