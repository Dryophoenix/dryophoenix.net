<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Mailing List{% endblock %} · dryophoenix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #181818;
      --border:   #2a2a2a;
      --text:     #e8e8e8;
      --muted:    #666;
      --accent:   #7fff6e;
      --danger:   #ff5f5f;
      --mono:     'IBM Plex Mono', monospace;
      --sans:     'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    nav a {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      margin-left: 20px;
    }
    nav a:hover { color: var(--text); text-decoration: none; }

    main { padding: 32px 0 64px; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .btn-accent { border-color: var(--accent); color: var(--accent); }
    .btn-accent:hover { background: var(--accent); color: #000; }
    .btn-danger { border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 3px 9px; font-size: 11px; }

    /* ── Forms ── */
    input[type=text], input[type=email], input[type=password], textarea, select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    label { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }

    /* ── Stat pills ── */
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 20px;
    }
    .stat-val {
      font-family: var(--mono);
      font-size: 26px;
      color: var(--accent);
      line-height: 1;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      font-family: var(--mono);
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: var(--surface); }
    .mono { font-family: var(--mono); font-size: 12px; }
    .muted { color: var(--muted); }

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 2px;
      border: 1px solid currentColor;
    }
    .badge-active   { color: var(--accent); }
    .badge-inactive { color: var(--muted); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .toolbar form { display: flex; gap: 8px; align-items: center; }
    .toolbar input[type=text] { width: 220px; }

    /* ── Filter tabs ── */
    .tabs { display: flex; gap: 4px; }
    .tab {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      cursor: pointer;
      background: transparent;
      text-decoration: none;
    }
    .tab:hover { color: var(--text); border-color: var(--text); text-decoration: none; }
    .tab.active { border-color: var(--accent); color: var(--accent); }

    /* ── Notes inline edit ── */
    .notes-form { display: flex; gap: 6px; align-items: center; }
    .notes-form input { width: 180px; }

    /* ── Section heading ── */
    .section-head {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    /* ── Add / import row ── */
    .action-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .action-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px 20px;
      flex: 1;
      min-width: 240px;
    }
    .action-box .section-head { margin-bottom: 10px; }
    .action-box form { display: flex; flex-direction: column; gap: 8px; }
    .action-box .inline { flex-direction: row; align-items: flex-end; gap: 8px; }
    .action-box .inline > div { flex: 1; }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <span class="logo">// dryophoenix · mailing list</span>
    <nav>
      <a href="{{ url_for('index') }}">subscribers</a>
      <a href="{{ url_for('export_csv') }}">export csv</a>
      <a href="{{ url_for('logout') }}">logout</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
